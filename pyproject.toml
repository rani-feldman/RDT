[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdt"
version = "0.1.0"
description = "Remote Debugger Tool: read and write firmware variables and memory over a COM port or LAN"
requires-python = ">=3.11"
dependencies = [
    "pyelftools>=0.31",
    "pyserial>=3.5",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "pyreadline3>=3.4; sys_platform == 'win32'",   # history and Tab completion in rdt console
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.2"]

[project.scripts]
rdt = "rdt.cli:main"
rdt-sim = "sim.__main__:main"

[project.gui-scripts]
rdt-gui = "rdt.gui.app:main"

[tool.setuptools.packages.find]
include = ["rdt*", "sim*"]

[tool.setuptools.package-data]
sim = ["examples/*.toml", "examples/firmware/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

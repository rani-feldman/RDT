# Simulated device with a main MCU and one secondary MCU, each loaded from its own ELF.
idn                 = "RDT,Simulator,SIM0001,0.1.0"
profile             = "default_profile.toml"
internal_timeout_ms = 50      # how long the main MCU waits for a secondary MCU before -240
error_reply         = false   # as the firmware: a failed command sends no reply; true replies with the error text

[transport]
tcp      = "127.0.0.1:5025"
udp      = "127.0.0.1:5025"
# serial = "COM11"            # one end of a com0com pair on Windows; "pty" on Linux
baud     = 115200
udp_drop = 0.0

[[mcu]]
id   = 0
name = "main"
elf  = "firmware/main.elf"

  [[mcu.ranges]]              # a peripheral block with no ELF section behind it
  name  = "GPIOA"
  start = 0x48000000
  size  = 0x400

  [[mcu.signals]]
  name      = "tick_count"
  addr      = 0x20000010
  type      = "u32"
  kind      = "counter"
  period_ms = 1

  [[mcu.signals]]
  name      = "motor.speed"
  addr      = 0x20000000
  type      = "f32"
  kind      = "sine"
  period_ms = 2000
  amplitude = 1500
  offset    = 1500

  # Members of the structures and arrays in main_data.c, so they change too.
  [[mcu.signals]]
  name      = "imu.accel.x"
  addr      = 0x20000400
  type      = "f32"
  kind      = "sine"
  period_ms = 1500
  amplitude = 2

  [[mcu.signals]]
  name      = "imu.gyro.z"
  addr      = 0x20000414
  type      = "f32"
  kind      = "sawtooth"
  period_ms = 4000
  amplitude = 90

  [[mcu.signals]]
  name      = "channels[0].measured"
  addr      = 0x20000464
  type      = "f32"
  kind      = "sine"
  period_ms = 3000
  amplitude = 0.5
  offset    = 12

  [[mcu.signals]]
  name      = "channels[1].measured"
  addr      = 0x20000488
  type      = "f32"
  kind      = "square"
  period_ms = 2000
  amplitude = 0.2
  offset    = 2.5

  [[mcu.signals]]
  name      = "channels[2].measured"
  addr      = 0x200004AC
  type      = "f32"
  kind      = "sawtooth"
  period_ms = 6000
  amplitude = 5
  offset    = 40

  [[mcu.signals]]
  name      = "channels[1].error_count"
  addr      = 0x2000049C
  type      = "u32"
  kind      = "counter"
  period_ms = 1000

  [[mcu.signals]]
  name      = "adc_samples[0]"
  addr      = 0x200005BC
  type      = "i16"
  kind      = "sine"
  period_ms = 1000
  amplitude = 2000

  [[mcu.signals]]
  name      = "adc_samples[1]"
  addr      = 0x200005BE
  type      = "i16"
  kind      = "sawtooth"
  period_ms = 1000
  amplitude = 2000

  [[mcu.signals]]
  name      = "boards[0].channel[1].measured"
  addr      = 0x2000054C
  type      = "f32"
  kind      = "sine"
  period_ms = 2500
  amplitude = 0.3
  offset    = 1

[[mcu]]
id               = 1
name             = "motorctl"
elf              = "firmware/motorctl.elf"
frame_size       = 64         # internal channel frame; larger reads are split
frame_latency_ms = 1
silent           = false      # also switchable at run time: SIM:MCU:SIL 1,ON

  [[mcu.signals]]
  name      = "adc_log.count"
  addr      = 0x20000080
  type      = "u32"
  kind      = "counter"
  period_ms = 1

  [[mcu.signals]]
  name      = "temperature"
  addr      = 0x20000088
  type      = "f32"
  kind      = "sawtooth"
  period_ms = 5000
  amplitude = 10
  offset    = 30

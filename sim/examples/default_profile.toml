# SCPI profile: the same [scpi] table the RDT host uses. The simulator answers exactly these
# templates, so editing them here is how to try another command set before the firmware has it.
[scpi]
name         = "RDT simulator"
read         = "MEMory:READ? {mcu},{addr},{len}"
write        = "MEMory:WRITE {mcu},{addr},{value},{size}"
value_format = "0x{value:X}"
addr_format  = "0x{addr:08X}"
max_write    = 4
data_format  = "hex"           # hex | bytes_csv | decimal | ieee_block
byte_order   = "little"
max_response = 1024
error_query  = "SYSTem:ERRor?"
terminator   = "\n"
timeout_ms   = 500

# SCPI profile: the same [scpi] table the RDT host uses. The simulator answers exactly these
# templates, so editing them here is how to try another command set before the firmware has it.
# {addr} and {value} are always bare hex with no prefix (20000000, 3FC00000); {addr} has at least 8 digits (08000000), and a read reply
# is one bare hex value per 4-byte word, comma-separated, lowest address first (3FC00000,43B40000).
[scpi]
name         = "RDT simulator"
read         = "MEMory:READ? {mcu},{addr},{len}"
write        = "MEMory:WRITE {mcu},{addr},{value}"
max_write    = 4
align        = 4               # every read and write is whole 4-byte aligned words (1, 2 or 4)
byte_order   = "little"
max_response = 1024            # largest read reply, in bytes; RDT never asks the device for it
terminator   = "\n"
timeout_ms   = 500
